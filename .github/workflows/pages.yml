# Builds the page and publishes dist/ to GitHub Pages at
# https://nicolasfeoli.github.io/whatsapp-chat-analyzer/
#
# Runs on every push to main, so the live page always matches the branch, and
# can also be started by hand from the Actions tab. The build job runs the same
# `npm run check` gate as CI; a commit that fails it is not published.
#
# GitHub Pages cannot send HTTP headers, so the Content-Security-Policy stays a
# <meta> tag with the gaps listed under "Known limits" in ROADMAP.md.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing is granted at the top level; each job asks for what it needs.
permissions: {}

# Let a deployment that has started finish, and never run two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The same gate as CI, which also leaves the production build in dist/.
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Both are required by actions/deploy-pages: one to publish, one to prove where the build came from.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
